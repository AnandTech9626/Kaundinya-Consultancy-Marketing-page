name: CI

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

jobs:
  marketing:
    name: Marketing site — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (astro check)
        run: npm run check

      - name: Build (astro build)
        run: npm run build
